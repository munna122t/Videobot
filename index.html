<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Avatar Reaction Bot</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.18.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
<style>
body { font-family: Arial; background: #1e1e1e; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px;}
h1 { font-size: 28px; margin-bottom: 10px; }
#video-demo, #avatar-video { border-radius: 12px; background: black; margin-bottom: 10px;}
#chat-output { background: #333; padding: 10px; width: 100%; max-width: 600px; min-height: 100px; border-radius: 8px; overflow-y: auto; font-size: 20px; }
button { padding: 10px 15px; font-size: 18px; border-radius: 8px; cursor: pointer; border: none; background-color: #4caf50; color: #fff; }
</style>
</head>
<body>

<h1>Avatar Reaction Bot Demo</h1>

<input type="file" id="video-upload" accept="video/*" />
<video id="video-demo" width="400" height="300" controls></video>
<canvas id="avatar-video" width="400" height="300"></canvas>

<div id="chat-output"></div>
<button id="analyze-btn">Analyze & React</button>

<script>
// Elements
const videoUpload = document.getElementById('video-upload');
const videoDemo = document.getElementById('video-demo');
const avatarCanvas = document.getElementById('avatar-video');
const ctx = avatarCanvas.getContext('2d');
const chatOutput = document.getElementById('chat-output');
const analyzeBtn = document.getElementById('analyze-btn');

let uploadedVideo = null;

// Load video
videoUpload.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    const url = URL.createObjectURL(file);
    videoDemo.src = url;
    uploadedVideo = file;
  }
});

// Simple avatar drawing (lips move with speech)
function drawAvatar(mouthOpen = 0) {
  ctx.clearRect(0,0,avatarCanvas.width,avatarCanvas.height);
  // Head
  ctx.fillStyle = "#f5cba7";
  ctx.beginPath();
  ctx.arc(200,150,100,0,Math.PI*2);
  ctx.fill();
  // Eyes
  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.arc(160,120,10,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(240,120,10,0,Math.PI*2); ctx.fill();
  // Mouth
  ctx.fillStyle = "#900";
  ctx.beginPath();
  ctx.ellipse(200,200,50,mouthOpen,0,0,Math.PI*2);
  ctx.fill();
}

// Simulated speech recognition + mood detection
async function analyzeVideo() {
  if (!uploadedVideo) return alert("Upload a video first!");
  
  chatOutput.innerHTML += `<div style="color:#4caf50;">Analyzing video...</div>`;
  
  // Dummy speech-to-text (replace with real Whisper/Google STT)
  const detectedText = "I am feeling happy and excited!";
  chatOutput.innerHTML += `<div>Detected Speech: ${detectedText}</div>`;
  
  // Dummy mood detection (replace with real emotion model)
  const moods = ["happy", "sad", "angry", "neutral"];
  const detectedMood = moods[Math.floor(Math.random()*moods.length)];
  chatOutput.innerHTML += `<div>Detected Mood: ${detectedMood}</div>`;
  
  // Avatar reacts
  const reactionMap = {
    happy: "Haha! I love your vibe 😎",
    sad: "Oh no! Don't worry, stay strong 💪",
    angry: "Take a deep breath 😤",
    neutral: "Okay, got it! 😐"
  };
  const reactionText = reactionMap[detectedMood];
  
  // Animate avatar lips
  let mouthOpen = 0;
  const anim = setInterval(() => {
    drawAvatar(mouthOpen);
    mouthOpen = mouthOpen === 0 ? 30 : 0;
  }, 400);
  
  // Speak reaction
  const speech = new SpeechSynthesisUtterance(reactionText);
  speech.lang = "en-US"; speech.rate=1; speech.pitch=1;
  speechSynthesis.speak(speech);
  speech.onend = () => clearInterval(anim);
  
  chatOutput.innerHTML += `<div>Avatar: ${reactionText}</div>`;
  chatOutput.scrollTop = chatOutput.scrollHeight;
}

analyzeBtn.addEventListener('click', analyzeVideo);
</script>

</body>
</html>
