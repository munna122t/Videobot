<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Futuristic Avatar Mentor</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; font-family:Arial,sans-serif; }
body, html { width:100%; height:100%; background:#0d0d0d; color:#fff; overflow:hidden; }
header { text-align:center; padding:15px; font-size:32px; color:#00fff7; text-shadow:0 0 8px #00fff7; }
.container { display:flex; flex-direction:row; height:calc(100% - 70px); }
.avatar-section { flex:1; display:flex; justify-content:center; align-items:center; position:relative; }
#avatar-canvas { border-radius:20px; background:#111; box-shadow:0 0 20px #00fff7; }
.chat-section { flex:1; display:flex; flex-direction:column; padding:15px; background:rgba(0,0,0,0.6); backdrop-filter:blur(8px); }
#chat-output { flex:1; overflow-y:auto; border-radius:12px; background:rgba(30,30,30,0.8); padding:10px; font-size:25px; margin-bottom:10px; }
#user-input { font-size:25px; padding:10px; border-radius:8px; border:none; margin-bottom:10px; width:100%; background:#222; color:#fff; }
button { background:#00fff7; color:#000; padding:12px 20px; margin-bottom:10px; font-weight:bold; border-radius:8px; font-size:20px; cursor:pointer; }
button:hover { opacity:0.9; }
.user-msg { color:#4caf50; margin-bottom:5px; }
.bot-msg { color:#fff; margin-bottom:5px; }
</style>
</head>
<body>

<header>Live Futuristic Avatar Mentor 🤖</header>

<div class="container">
  <div class="avatar-section">
    <video id="live-video" autoplay muted playsinline style="display:none;"></video>
    <canvas id="avatar-canvas" width="450" height="450"></canvas>
  </div>

  <div class="chat-section">
    <textarea id="user-input" placeholder="Type a question..." rows="2"></textarea>
    <button id="send-btn">Send</button>
    <div id="chat-output"></div>
  </div>
</div>

<script>
// Elements
const avatarCanvas = document.getElementById('avatar-canvas');
const ctx = avatarCanvas.getContext('2d');
const liveVideo = document.getElementById('live-video');
const chatOutput = document.getElementById('chat-output');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

// ---------------- AVATAR DRAWING ----------------
function drawAvatar(mouthOpen=0, eyeLeftOpen=1, eyeRightOpen=1){
  ctx.clearRect(0,0,avatarCanvas.width,avatarCanvas.height);
  // Head
  ctx.fillStyle="#f5cba7";
  ctx.beginPath();
  ctx.arc(225,225,120,0,Math.PI*2);
  ctx.fill();
  // Eyes
  ctx.fillStyle="#000";
  ctx.beginPath(); ctx.ellipse(175,180,15,15*eyeLeftOpen,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(275,180,15,15*eyeRightOpen,0,0,Math.PI*2); ctx.fill();
  // Mouth
  ctx.fillStyle="#900";
  ctx.beginPath();
  ctx.ellipse(225,300,60,mouthOpen,0,0,Math.PI*2);
  ctx.fill();
}

// ---------------- LIVE CAMERA ----------------
async function initCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  liveVideo.srcObject = stream;
  await liveVideo.play();
}
initCamera();

// ---------------- FACE MESH (EMOTION DETECTION SIM) ----------------
function fakeEmotionAnalysis(){
  // Placeholder: can use FaceMesh landmarks to detect smile/frown etc
  const moods=["happy","sad","angry","neutral"];
  return moods[Math.floor(Math.random()*moods.length)];
}

// ---------------- SPEECH SYNTHESIS ----------------
function speak(text){
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang="en-US"; speech.rate=1; speech.pitch=1;
  speechSynthesis.speak(speech);
}

// ---------------- SPEECH RECOGNITION ----------------
let recognition=null;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang="en-US"; recognition.continuous=false;
  recognition.interimResults=false;

  recognition.onresult = (event)=>{
    const text = event.results[0][0].transcript;
    chatOutput.innerHTML += `<div class="user-msg">You: ${text}</div>`;
    generateReaction(text);
  }
}

// ---------------- SEND BUTTON ----------------
sendBtn.addEventListener('click', ()=>{
  if(userInput.value.trim()!==""){
    const text=userInput.value.trim();
    chatOutput.innerHTML += `<div class="user-msg">You: ${text}</div>`;
    userInput.value="";
    generateReaction(text);
  } else if(recognition) recognition.start();
});

// ---------------- REACTION LOGIC ----------------
function generateReaction(userText){
  const detectedMood=fakeEmotionAnalysis();
  chatOutput.innerHTML += `<div class="bot-msg">Detected Mood: ${detectedMood}</div>`;
  const reactions={
    happy:"Haha! Love your vibe 😎",
    sad:"Stay strong! 💪",
    angry:"Take a deep breath 😤",
    neutral:"Got it! 😐"
  };
  const reactionText=reactions[detectedMood];
  chatOutput.innerHTML += `<div class="bot-msg">Avatar: ${reactionText}</div>`;
  chatOutput.scrollTop=chatOutput.scrollHeight;

  // Avatar lips animation while speaking
  let mouthOpen=0;
  const anim=setInterval(()=>{
    drawAvatar(mouthOpen);
    mouthOpen=mouthOpen===0?30:0;
  },300);

  speak(reactionText);
  const speechEndTime=reactionText.length*80; // rough estimate
  setTimeout(()=>clearInterval(anim),speechEndTime);
}

// ---------------- AVATAR ANIMATION LOOP ----------------
setInterval(()=>{
  drawAvatar(0); // keep default face animation
},1000);
</script>

</body>
</html>
