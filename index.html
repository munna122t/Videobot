<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Avatar Mentor</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body, html { width:100%; height:100%; background:#0d0d0d; color:#fff; display:flex; justify-content:center; align-items:center; }
#container { display:flex; flex-direction:column; align-items:center; width:100%; height:100%; position:relative; }
/* Full screen neon panels */
#top-panel, #bottom-panel { position:absolute; left:0; width:100%; height:50px; background:linear-gradient(90deg, #00fff7, #ff00f7); opacity:0.2; }
#bottom-panel { bottom:0; top:auto; }
#left-panel, #right-panel { position:absolute; top:0; width:50px; height:100%; background:linear-gradient(180deg, #00fff7, #ff00f7); opacity:0.2; }
#right-panel { right:0; left:auto; }

#square { width:500px; height:500px; background:#111; border-radius:20px; box-shadow:0 0 30px #00fff7; position:relative; display:flex; justify-content:center; align-items:center; overflow:hidden; z-index:1; }
#live-video, #avatar-canvas { position:absolute; top:0; left:0; width:100%; height:100%; border-radius:20px; }
#avatar-canvas { display:none; }

#buttons { margin-top:20px; display:flex; flex-wrap:wrap; gap:15px; justify-content:center; }
button { padding:12px 20px; font-size:18px; font-weight:bold; border:none; border-radius:10px; cursor:pointer; background:#00fff7; color:#000; transition:0.3s; }
button:hover { opacity:0.9; }

#chat-output { position:absolute; right:20px; top:80px; width:300px; max-height:400px; overflow-y:auto; background:rgba(30,30,30,0.85); padding:10px; border-radius:12px; font-size:18px; z-index:2; }
.user-msg { color:#4caf50; margin-bottom:5px; }
.bot-msg { color:#fff; margin-bottom:5px; }
</style>
</head>
<body>

<div id="container">
  <div id="top-panel"></div>
  <div id="bottom-panel"></div>
  <div id="left-panel"></div>
  <div id="right-panel"></div>

  <div id="square">
    <video id="live-video" autoplay muted playsinline></video>
    <canvas id="avatar-canvas"></canvas>
  </div>

  <div id="buttons">
    <button id="talk-btn">Talk to Avatar</button>
    <button id="reset-btn">Back to Face</button>
    <button id="mood-btn">Check Mood</button>
    <button id="meme-btn">Random Meme</button>
    <button id="style-btn">Toggle Avatar Style</button>
    <button id="mic-btn">Mic On/Off</button>
    <button id="theme-btn">Theme Switch</button>
    <button id="clear-btn">Clear Chat</button>
  </div>

  <div id="chat-output"></div>
</div>

<script>
// Elements
const liveVideo = document.getElementById('live-video');
const avatarCanvas = document.getElementById('avatar-canvas');
const ctx = avatarCanvas.getContext('2d');
const talkBtn = document.getElementById('talk-btn');
const resetBtn = document.getElementById('reset-btn');
const moodBtn = document.getElementById('mood-btn');
const memeBtn = document.getElementById('meme-btn');
const styleBtn = document.getElementById('style-btn');
const micBtn = document.getElementById('mic-btn');
const themeBtn = document.getElementById('theme-btn');
const clearBtn = document.getElementById('clear-btn');
const chatOutput = document.getElementById('chat-output');

let avatarMode=false;
let lastMood="neutral";
let avatarStyle=0;
let micEnabled=true;
let darkTheme=true;

// ---------------- INIT CAMERA & AUDIO ----------------
async function initCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  liveVideo.srcObject = stream;
  await liveVideo.play();

  const audioContext = new AudioContext();
  const source = audioContext.createMediaStreamSource(stream);
  const gainNode = audioContext.createGain();
  source.connect(gainNode);
  gainNode.connect(audioContext.destination);

  const analyser = audioContext.createAnalyser();
  gainNode.connect(analyser);
  analyser.fftSize=256;
  window.audioAnalyser = analyser;
  window.dataArray = new Uint8Array(analyser.fftSize);
}
initCamera();

// ---------------- FACEMESH ----------------
const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});
faceMesh.setOptions({maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.7, minTrackingConfidence:0.7});
faceMesh.onResults(onFaceResults);
const cameraMP = new Camera(liveVideo, {onFrame: async ()=> { await faceMesh.send({image: liveVideo}); }, width:500, height:500});
cameraMP.start();

// ---------------- AVATAR DRAWING ----------------
avatarCanvas.width=500; avatarCanvas.height=500;
function drawAvatar(mouthOpen=0, mood="neutral"){
  ctx.clearRect(0,0,avatarCanvas.width,avatarCanvas.height);
  // Head centered
  ctx.fillStyle="#f5cba7"; ctx.beginPath(); ctx.arc(250,250,120,0,Math.PI*2); ctx.fill();
  // Eyes
  const eyeHeight = mood==="happy"?10:15;
  ctx.fillStyle="#000"; ctx.beginPath(); ctx.ellipse(200,220,15,eyeHeight,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(300,220,15,eyeHeight,0,0,Math.PI*2); ctx.fill();
  // Mouth
  ctx.fillStyle="#900"; ctx.beginPath();
  if(mood==="happy") ctx.ellipse(250,320,60,mouthOpen*1.2,0,0,Math.PI*2);
  else if(mood==="sad") ctx.ellipse(250,330,60,mouthOpen*0.5,0,0,Math.PI*2);
  else ctx.ellipse(250,320,60,mouthOpen,0,0,Math.PI*2);
  ctx.fill();
}

// ---------------- FACE RESULTS & MOOD ----------------
function onFaceResults(results){
  if(avatarMode) return;
  ctx.clearRect(0,0,avatarCanvas.width,avatarCanvas.height);
  if(results.multiFaceLandmarks && results.multiFaceLandmarks.length>0){
    const lm = results.multiFaceLandmarks[0];
    const upperLip = lm[13]; const lowerLip = lm[14];
    const mouthOpen = Math.hypot((upperLip.x-lowerLip.x)*avatarCanvas.width,(upperLip.y-lowerLip.y)*avatarCanvas.height);
    const leftMouth=lm[61]; const rightMouth=lm[291];
    const smileDist=Math.hypot((leftMouth.x-rightMouth.x)*avatarCanvas.width,(leftMouth.y-rightMouth.y)*avatarCanvas.height);
    const leftEyebrow=lm[105]; const leftEye=lm[33];
    const browDist=(leftEyebrow.y-leftEye.y)*avatarCanvas.height;

    if(smileDist>45) lastMood="happy";
    else if(browDist<-5) lastMood="angry";
    else if(mouthOpen>8 && smileDist<35) lastMood="sad";
    else lastMood="neutral";

    ctx.strokeStyle="#00fff7"; ctx.lineWidth=4; ctx.strokeRect(50,50,400,400);
    ctx.fillStyle="rgba(0,255,255,0.1)"; ctx.fillRect(50,50,400,400);
  }
}

// ---------------- SPEAK FUNCTION ----------------
function speak(text){
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang="en-US"; utter.rate=1; utter.pitch=1;
  speechSynthesis.speak(utter);
}

// ---------------- BUTTONS ----------------
talkBtn.addEventListener('click',()=>{
  avatarMode=true;
  avatarCanvas.style.display="block";
  liveVideo.style.display="none";

  const anim=setInterval(()=>{
    let amp=30;
    if(micEnabled){
      window.audioAnalyser.getByteTimeDomainData(window.dataArray);
      amp = window.dataArray.reduce((a,v)=>a+Math.abs(v-128),0)/window.dataArray.length;
    }
    drawAvatar(amp*0.5,lastMood);
  },50);

  const reactions={happy:"Haha! You look so happy 😎", sad:"Oh no! Stay strong 💪", angry:"Take a deep breath 😤", neutral:"Got it! 😐"};
  const reactionText = reactions[lastMood] || reactions["neutral"];
  chatOutput.innerHTML += `<div class="bot-msg">Avatar: ${reactionText}</div>`;
  chatOutput.scrollTop=chatOutput.scrollHeight;
  speak(reactionText);
});

resetBtn.addEventListener('click',()=>{avatarMode=false; avatarCanvas.style.display="none"; liveVideo.style.display="block";});
moodBtn.addEventListener('click',()=>{chatOutput.innerHTML+=`<div class="bot-msg">Mood Detected: ${lastMood}</div>`; chatOutput.scrollTop=chatOutput.scrollHeight;});
memeBtn.addEventListener('click',()=>{const memes=["😎 Cool Meme!","😂 Haha Meme!","🤯 Mind-blown Meme!"]; chatOutput.innerHTML+=`<div class="bot-msg">Avatar: ${memes[Math.floor(Math.random()*memes.length)]}</div>`; chatOutput.scrollTop=chatOutput.scrollHeight;});
styleBtn.addEventListener('click',()=>{avatarStyle=(avatarStyle+1)%2; lastMood=avatarStyle===0?"neutral":"happy";});
micBtn.addEventListener('click',()=>{micEnabled=!micEnabled;});
themeBtn.addEventListener('click',()=>{darkTheme=!darkTheme; document.body.style.background=darkTheme?"#0d0d0d":"#eee"; document.body.style.color=darkTheme?"#fff":"#000";});
clearBtn.addEventListener('click',()=>{chatOutput.innerHTML="";});

</script>

</body>
</html>
