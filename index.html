<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Avatar Mentor with Real Emotion</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body, html { width:100%; height:100%; background:#0d0d0d; color:#fff; display:flex; justify-content:center; align-items:center; }
#container { display:flex; flex-direction:column; align-items:center; }
#square { width:500px; height:500px; background:#111; border-radius:20px; box-shadow:0 0 30px #00fff7; position:relative; display:flex; justify-content:center; align-items:center; overflow:hidden; }
#live-video, #avatar-canvas { position:absolute; top:0; left:0; width:100%; height:100%; border-radius:20px; }
#avatar-canvas { display:none; }
#buttons { margin-top:20px; display:flex; gap:20px; }
button { padding:12px 20px; font-size:20px; font-weight:bold; border:none; border-radius:10px; cursor:pointer; background:#00fff7; color:#000; transition:0.3s; }
button:hover { opacity:0.9; }
#chat-output { margin-top:20px; width:500px; max-height:200px; overflow-y:auto; background:rgba(30,30,30,0.8); padding:10px; border-radius:12px; font-size:20px; }
.user-msg { color:#4caf50; margin-bottom:5px; }
.bot-msg { color:#fff; margin-bottom:5px; }
</style>
</head>
<body>

<div id="container">
  <div id="square">
    <video id="live-video" autoplay muted playsinline></video>
    <canvas id="avatar-canvas"></canvas>
  </div>
  <div id="buttons">
    <button id="talk-btn">Talk to Avatar</button>
    <button id="reset-btn">Back to Face</button>
  </div>
  <div id="chat-output"></div>
</div>

<script>
// Elements
const liveVideo = document.getElementById('live-video');
const avatarCanvas = document.getElementById('avatar-canvas');
const ctx = avatarCanvas.getContext('2d');
const talkBtn = document.getElementById('talk-btn');
const resetBtn = document.getElementById('reset-btn');
const chatOutput = document.getElementById('chat-output');

let avatarMode=false;
let lastMood="neutral";

// ---------------- INIT CAMERA ----------------
async function initCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  liveVideo.srcObject = stream;
  await liveVideo.play();
}
initCamera();

// ---------------- FACEMESH ----------------
const faceMesh = new FaceMesh({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});
faceMesh.setOptions({
  maxNumFaces:1,
  refineLandmarks:true,
  minDetectionConfidence:0.7,
  minTrackingConfidence:0.7
});
faceMesh.onResults(onFaceResults);

const camera = new Camera(liveVideo, {
  onFrame: async ()=> { await faceMesh.send({image: liveVideo}); },
  width:500,
  height:500
});
camera.start();

// ---------------- AVATAR DRAWING ----------------
function drawAvatar(mouthOpen=0, eyeLeftOpen=1, eyeRightOpen=1, mood="neutral"){
  ctx.clearRect(0,0,avatarCanvas.width,avatarCanvas.height);
  // Head
  ctx.fillStyle="#f5cba7"; ctx.beginPath(); ctx.arc(250,250,120,0,Math.PI*2); ctx.fill();
  // Eyes (adjust height based on mood)
  const eyeHeight = mood==="happy"?10:eyeLeftOpen*15;
  ctx.fillStyle="#000"; ctx.beginPath(); ctx.ellipse(200,220,15,eyeHeight,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(300,220,15,eyeHeight,0,0,Math.PI*2); ctx.fill();
  // Mouth
  ctx.fillStyle="#900"; ctx.beginPath();
  if(mood==="happy") ctx.ellipse(250,320,60,mouthOpen*1.2,0,0,Math.PI*2);
  else if(mood==="sad") ctx.ellipse(250,330,60,mouthOpen*0.5,0,0,Math.PI*2);
  else ctx.ellipse(250,320,60,mouthOpen,0,0,Math.PI*2);
  ctx.fill();
}

// ---------------- FACE RESULTS & EMOTION ----------------
function onFaceResults(results){
  if(avatarMode) return; // skip avatar mode
  ctx.clearRect(0,0,avatarCanvas.width,avatarCanvas.height);
  if(results.multiFaceLandmarks && results.multiFaceLandmarks.length>0){
    const lm = results.multiFaceLandmarks[0];
    const upperLip = lm[13]; const lowerLip = lm[14];
    const mouthOpen = Math.hypot((upperLip.x-lowerLip.x)*avatarCanvas.width,(upperLip.y-lowerLip.y)*avatarCanvas.height);

    // Smile detection
    const leftMouth=lm[61]; const rightMouth=lm[291];
    const smileDist=Math.hypot((leftMouth.x-rightMouth.x)*avatarCanvas.width,(leftMouth.y-rightMouth.y)*avatarCanvas.height);

    // Eyebrows
    const leftEyebrow=lm[105]; const leftEye=lm[33];
    const browDist=(leftEyebrow.y-leftEye.y)*avatarCanvas.height;

    // Determine mood
    if(smileDist>45) lastMood="happy";
    else if(browDist<-5) lastMood="angry";
    else if(mouthOpen>8 && smileDist<35) lastMood="sad";
    else lastMood="neutral";

    // Draw rectangle highlight
    ctx.strokeStyle="#00fff7"; ctx.lineWidth=4; ctx.strokeRect(50,50,400,400);
    ctx.fillStyle="rgba(0,255,255,0.1)"; ctx.fillRect(50,50,400,400);
  }
}

// ---------------- TALK BUTTON ----------------
talkBtn.addEventListener('click', ()=>{
  avatarMode=true;
  avatarCanvas.style.display="block";
  liveVideo.style.display="none";

  // Avatar reacts based on lastMood
  const reactions={
    happy:"Haha! You look so happy 😎",
    sad:"Oh no! Stay strong 💪",
    angry:"Take a deep breath 😤",
    neutral:"Got it! 😐"
  };
  const reactionText = reactions[lastMood] || reactions["neutral"];
  chatOutput.innerHTML += `<div class="bot-msg">Avatar: ${reactionText}</div>`;
  chatOutput.scrollTop=chatOutput.scrollHeight;

  // Animate lips while speaking
  let mouthOpen=0;
  const anim=setInterval(()=>{
    drawAvatar(mouthOpen,1,1,lastMood);
    mouthOpen=mouthOpen===0?30:0;
  },300);

  const speech=new SpeechSynthesisUtterance(reactionText);
  speech.lang="en-US"; speech.rate=1; speech.pitch=1;
  speechSynthesis.speak(speech);
  speech.onend=()=>clearInterval(anim);
});

// ---------------- RESET BUTTON ----------------
resetBtn.addEventListener('click', ()=>{
  avatarMode=false;
  avatarCanvas.style.display="none";
  liveVideo.style.display="block";
});
</script>

</body>
</html>
